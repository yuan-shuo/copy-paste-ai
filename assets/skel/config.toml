# ============================================================
# Copy-Paste AI 配置文件
# 取消注释即可启用对应功能
# ============================================================


# ============================================================
# [default] 默认文件列表
# 当执行 `cpa gen` 时，会默认将此处配置的文件添加到生成的文件中，不需要额外 -f 指定
# 用法: files = ["文件路径1", "文件路径2", ...]
# 示例: files = ["main.go", "go.mod", "internal/app/app.go"]
# ============================================================

# [default]
# files = ["main.go", "go.mod"]


# ============================================================
# [file_aliases] 文件别名
# 为常用的文件组定义别名，执行 `cpa gen -f 别名` 时会展开为对应文件列表
# 用法: "别名" = ["文件路径1", "文件路径2", ...]
# 示例: "core" = ["pkg/core/core.go", "pkg/core/utils.go"]
#       执行 `cpa gen -f core` 等价于指定这两个文件
# ============================================================

# [file_aliases]
# "main" = ["main.go"]
# "test" = ["internal/test.go"]
# "core" = ["pkg/core/core.go", "pkg/core/utils.go"]
# "all" = ["main.go", "internal/test.go", "pkg/core/core.go"]


# ============================================================
# [prompt] 提示词配置
# 自定义 AI 提示词，生成 .md 文件时会放在文件末尾
# 用法: content = """
#         多行提示词内容
#         """
# 示例: content = """
#         # 提示
#         请分析以上代码并给出建议
#         """
# ============================================================

# [prompt]
# content = """
# # 提示
# 
# 请根据以上项目文件树和代码，完成用户的需求。
# 
# 1. 对于需要改动的文件，给出完整的代码，禁止删除用户原有的注释
# 2. 最终总结所有改动
# 3. 检查代码是否符合语言规范
# 4. 给出可执行的终端命令
# """


# ============================================================
# [gitignore] .gitignore 规则
# 是否遵循项目中的 .gitignore 文件过滤文件树
# 用法: enabled = true/false
# 默认: true（启用）
# 示例: enabled = false  (禁用 .gitignore 过滤，显示所有文件)
# ============================================================

# [gitignore]
# enabled = true
