name: Go Report Card CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install goreportcard-cli
        run: |
          git clone https://github.com/gojp/goreportcard.git /tmp/goreportcard
          cd /tmp/goreportcard
          make install
          go install ./cmd/goreportcard-cli

      - name: Run goreportcard-cli with threshold
        run: |
          goreportcard-cli -v -t 100
