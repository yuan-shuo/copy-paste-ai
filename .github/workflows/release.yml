name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 调用 CI 工作流
  ci-check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # 调用 GoReport 工作流
  goreport-check:
    uses: ./.github/workflows/goreportcard.yml
    secrets: inherit

  # Release - 等待所有检查通过
  release:
    runs-on: ubuntu-latest
    needs: [ci-check, goreport-check]
    if: |
      always() &&
      needs.ci-check.result == 'success' &&
      needs.goreport-check.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --config build/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}